[project]
name = "ya-mosaed-backend"
version = "0.1.0"
description = "Deterministic Egyptian Arabic reminder parsing and Whisper speech API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.34,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "dateparser>=1.2,<2.0",
  "faster-whisper>=1.1,<2.0",
  # faster-whisper 1.2 calls av.open(metadata_errors=...), removed in newer PyAV.
  "av>=11,<17",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9.0", "httpx>=0.28,<1.0", "ruff>=0.11,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
